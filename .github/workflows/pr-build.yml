name: Build Geest APK on PR

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Geest source from embedded payload
        shell: bash
        run: |
          grep '^UEsDB' .github/workflows/build-geest-apk.yml > /tmp/geest.zip.b64
          base64 -d /tmp/geest.zip.b64 > /tmp/geest.zip
          unzip -o /tmp/geest.zip -d "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          needle = '    buildFeatures {\n        compose = true\n    }\n'
          repl = '''    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }
'''
          if needle not in s:
              raise SystemExit('buildFeatures block not found')
          p.write_text(s.replace(needle, repl))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
