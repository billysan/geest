name: Build Geest APK on PR

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Geest v0.3 source
        shell: bash
        run: |
          cat .github/geest-v03/part* > /tmp/geest.zip.b64
          base64 -d /tmp/geest.zip.b64 > /tmp/geest.zip
          unzip -o /tmp/geest.zip -d "$GITHUB_WORKSPACE"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build arm64 debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geest-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
