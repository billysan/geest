name: Build Geest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Materialize Geest source
        shell: bash
        run: |
          cat > /tmp/geest.zip.b64 <<'GEEST_PAYLOAD'

GEEST_PAYLOAD
          base64 -d /tmp/geest.zip.b64 > /tmp/geest.zip
          unzip -o /tmp/geest.zip -d "$GITHUB_WORKSPACE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
